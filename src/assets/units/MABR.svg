<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- MABR (membrane aerated biofilm reactor), drawn as a membrane column: a cylindrical
     shell with a bundle of hollow-fibre membranes potted into both ends. Air enters the
     fibres at the bottom and leaves at the top; oxygen passes through the fibre wall into
     the biofilm growing on it, so there are no bubbles. The water flows through the shell,
     around the fibres (side nozzles at mid height, where the canvas ports lock on).
     Same 96-dpi canvas as the rest of the unit library. -->
<svg
   width="29.1mm"
   height="45mm"
   viewBox="0 0 110 170"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Shell water nozzles (in left, out right) -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1.6">
    <rect x="17" y="80" width="14" height="10"/>
    <rect x="79" y="80" width="14" height="10"/>
  </g>

  <!-- Shell: cylinder with an elliptic top and bottom -->
  <path d="M 30 22 V 150 A 25 6 0 0 0 80 150 V 22"
        fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <ellipse cx="55" cy="22" rx="25" ry="6"
           fill="#ffffff" stroke="#000000" stroke-width="1.8"/>

  <!-- Potting at both ends, where the fibres are cast in -->
  <g fill="#d4d4d8" stroke="#000000" stroke-width="1.1">
    <rect x="30" y="31" width="50" height="8"/>
    <rect x="30" y="133" width="50" height="8"/>
  </g>

  <!-- Hollow fibres: biofilm (grey sleeve), fibre wall (black), lumen (white) -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#94a77c" stroke-width="5.2" stroke-opacity="0.7" stroke-linecap="butt">
      <path d="M 36 39 V 133"/>
      <path d="M 41.5 39 V 133"/>
      <path d="M 47 39 V 133"/>
      <path d="M 52.5 39 V 133"/>
      <path d="M 58 39 V 133"/>
      <path d="M 63.5 39 V 133"/>
      <path d="M 69 39 V 133"/>
      <path d="M 74.5 39 V 133"/>
    </g>
    <g stroke="#000000" stroke-width="2.6" stroke-linecap="butt">
      <path d="M 36 39 V 133"/>
      <path d="M 41.5 39 V 133"/>
      <path d="M 47 39 V 133"/>
      <path d="M 52.5 39 V 133"/>
      <path d="M 58 39 V 133"/>
      <path d="M 63.5 39 V 133"/>
      <path d="M 69 39 V 133"/>
      <path d="M 74.5 39 V 133"/>
    </g>
    <g stroke="#ffffff" stroke-width="1.0" stroke-linecap="butt">
      <path d="M 36 39 V 133"/>
      <path d="M 41.5 39 V 133"/>
      <path d="M 47 39 V 133"/>
      <path d="M 52.5 39 V 133"/>
      <path d="M 58 39 V 133"/>
      <path d="M 63.5 39 V 133"/>
      <path d="M 69 39 V 133"/>
      <path d="M 74.5 39 V 133"/>
    </g>
  </g>

  <!-- Air in at the bottom, exhaust out at the top (both flowing upwards) -->
  <g fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 55 156 V 168"/>
    <path d="M 50 163 L 55 158 L 60 163"/>
    <path d="M 55 16 V 3"/>
    <path d="M 50 8 L 55 3 L 60 8"/>
  </g>
</svg>

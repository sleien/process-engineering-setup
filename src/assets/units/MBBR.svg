<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- MBBR (moving bed biofilm reactor): aerated basin + carrier basket + free-floaters
   + aeration header. Same 96-dpi canvas as the rest of the unit library. -->
<svg
   width="67mm"
   height="41mm"
   viewBox="0 0 253 155"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Vessel -->
  <rect x="8" y="100" width="192" height="50" rx="6"
        fill="none" stroke="#000000" stroke-width="1.8"/>
  <!-- Liquid level (dashed) -->
  <path d="M 12 112 H 196" stroke="#000000" stroke-width="0.9"
        stroke-dasharray="5 3" fill="none"/>
  <!-- Baffle / carrier basket -->
  <rect x="24" y="106" width="160" height="40"
        fill="none" stroke="#000000" stroke-width="1.4"/>
  <line x1="36"  y1="106" x2="36"  y2="146" stroke="#000000" stroke-width="1.1"/>
  <line x1="56"  y1="106" x2="56"  y2="146" stroke="#000000" stroke-width="1.1"/>
  <line x1="76"  y1="106" x2="76"  y2="146" stroke="#000000" stroke-width="1.1"/>
  <line x1="96"  y1="106" x2="96"  y2="146" stroke="#000000" stroke-width="1.1"/>
  <line x1="116" y1="106" x2="116" y2="146" stroke="#000000" stroke-width="1.1"/>
  <line x1="136" y1="106" x2="136" y2="146" stroke="#000000" stroke-width="1.1"/>
  <line x1="156" y1="106" x2="156" y2="146" stroke="#000000" stroke-width="1.1"/>
  <line x1="176" y1="106" x2="176" y2="146" stroke="#000000" stroke-width="1.1"/>
  <!-- Carriers floating above the basket -->
  <g fill="none" stroke="#000000" stroke-width="1.6">
    <circle cx="44"  cy="88"  r="7"/>
    <circle cx="68"  cy="72"  r="7"/>
    <circle cx="92"  cy="86"  r="7"/>
    <circle cx="118" cy="68"  r="8"/>
    <circle cx="144" cy="86"  r="8"/>
    <circle cx="168" cy="68"  r="7"/>
    <circle cx="80"  cy="50"  r="7"/>
    <circle cx="104" cy="42"  r="7"/>
    <circle cx="132" cy="50"  r="8"/>
  </g>
  <!-- Aeration header (right wall) + diffuser dots -->
  <rect x="168" y="116" width="20" height="30" fill="none"
        stroke="#000000" stroke-width="1.6"/>
  <line x1="178" y1="116" x2="178" y2="146" stroke="#000000" stroke-width="1.2"/>
  <g stroke="#000000" stroke-width="1.4" fill="none">
    <circle cx="178" cy="122" r="1.5"/>
    <circle cx="178" cy="128" r="1.5"/>
    <circle cx="178" cy="134" r="1.5"/>
    <circle cx="178" cy="140" r="1.5"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- MBBR (moving bed biofilm reactor): the aerated CSTR of this library — same tank, inlet
     and outlet shoulders, water-level mark, air line and diffuser grid, on the same
     160 x 98 canvas so it lines up with the other tanks — filled with biofilm carriers
     (wheel-shaped plastic elements, tinted for the biofilm on them) kept in the tank by a
     sieve at the outlet. -->
<svg
   width="42.335468mm"
   height="25.948841mm"
   viewBox="0 0 160 98"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Tank with inlet (left) and outlet (right) shoulders -->
  <path d="M 0 3.6 H 19.5 V 97.6 H 140.5 V 3.6 H 160"
        fill="none" stroke="#000000" stroke-width="1"/>
  <!-- Water level and its mark -->
  <path d="M 19.5 22.6 H 140.5" fill="none" stroke="#000000" stroke-width="1"/>
  <g fill="none" stroke="#000000" stroke-width="1">
    <path d="M 111.1 15.2 H 119.1 L 115.1 21.8 Z"/>
    <path d="M 107.6 25.6 H 122.6"/>
    <path d="M 110.6 28.1 H 119.5"/>
    <path d="M 112.6 30.6 H 117.5"/>
  </g>

  <!-- Air line down the left wall into the diffuser grid -->
  <path d="M 34.5 0 V 81.6 H 43.6" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 46.7 81.6 H 129.4" fill="none" stroke="#000000" stroke-width="1"
        stroke-dasharray="7.56 3.17"/>
  <!-- A few bubbles rising from it -->
  <g fill="none" stroke="#000000" stroke-width="0.8">
    <circle cx="52" cy="76" r="1.3"/>
    <circle cx="74" cy="74.5" r="1.3"/>
    <circle cx="97" cy="76.5" r="1.3"/>
    <circle cx="121" cy="75" r="1.3"/>
    <circle cx="63" cy="69" r="1.1"/>
    <circle cx="109" cy="69.5" r="1.1"/>
  </g>

  <!-- Biofilm carriers: wheel-shaped elements, some seen face-on, some tilted -->
  <defs>
    <g id="carrier">
      <circle r="4.4" fill="#dfe7d3" stroke="#000000" stroke-width="0.9"/>
      <circle r="1.9" fill="none" stroke="#000000" stroke-width="0.6"/>
      <path d="M -4.4 0 H 4.4 M 0 -4.4 V 4.4" stroke="#000000" stroke-width="0.6"/>
    </g>
    <g id="carrier-tilted">
      <ellipse rx="4.4" ry="2.3" fill="#dfe7d3" stroke="#000000" stroke-width="0.9"/>
      <path d="M -4.4 0 H 4.4" stroke="#000000" stroke-width="0.6"/>
    </g>
  </defs>
  <use href="#carrier" x="47" y="34"/>
  <use href="#carrier-tilted" x="62" y="40" transform="rotate(-25 62 40)"/>
  <use href="#carrier" x="78" y="31"/>
  <use href="#carrier" x="93" y="40"/>
  <use href="#carrier-tilted" x="127" y="38" transform="rotate(30 127 38)"/>
  <use href="#carrier" x="45" y="52"/>
  <use href="#carrier" x="70" y="55"/>
  <use href="#carrier-tilted" x="84" y="49" transform="rotate(20 84 49)"/>
  <use href="#carrier" x="107" y="44"/>
  <use href="#carrier" x="99" y="58"/>
  <use href="#carrier-tilted" x="118" y="55" transform="rotate(-35 118 55)"/>
  <use href="#carrier" x="56" y="66"/>
  <use href="#carrier-tilted" x="86" y="66" transform="rotate(-15 86 66)"/>
  <use href="#carrier" x="129" y="68"/>
  <use href="#carrier" x="113" y="70"/>

  <!-- Sieve at the outlet that keeps the carriers in the tank -->
  <rect x="132" y="25" width="6.5" height="22" fill="#ffffff" stroke="#000000" stroke-width="0.9"/>
  <path d="M 132 28.5 H 138.5 M 132 32 H 138.5 M 132 35.5 H 138.5 M 132 39 H 138.5 M 132 42.5 H 138.5"
        fill="none" stroke="#000000" stroke-width="0.6"/>
</svg>

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Influent: pipe + valve wheel + direction chevron, drawn on the same 96-dpi canvas as the
     other unit SVGs so its relative size matches the rest of the palette. -->
<svg
   width="20mm"
   height="20mm"
   viewBox="0 0 75 75"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Inflow pipe (horizontal) -->
  <rect x="2"   y="30" width="34" height="15" rx="2"
        fill="none" stroke="#000000" stroke-width="1.6"/>
  <!-- Flow direction chevrons -->
  <path d="M 10 32 L 15 37.5 L 10 43" fill="none" stroke="#000000" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 17 32 L 22 37.5 L 17 43" fill="none" stroke="#000000" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 24 32 L 29 37.5 L 24 43" fill="none" stroke="#000000" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Valve body -->
  <circle cx="48" cy="37.5" r="8" fill="none" stroke="#000000" stroke-width="1.6"/>
  <circle cx="48" cy="37.5" r="4" fill="none" stroke="#000000" stroke-width="1.2"/>
  <!-- Valve handle (spokes) -->
  <g stroke="#000000" stroke-width="1.6" stroke-linecap="round">
    <line x1="48" y1="30.5" x2="48" y2="44.5"/>
    <line x1="41" y1="37.5" x2="55" y2="37.5"/>
  </g>
  <!-- Outflow pipe (short, into the next unit) -->
  <rect x="56" y="30" width="17" height="15" rx="2"
        fill="none" stroke="#000000" stroke-width="1.6"/>
  <!-- "Q" glyph under the pipe (flow marker) -->
  <text x="13" y="62" font-family="serif" font-size="18" font-style="italic"
        fill="#000000" text-anchor="middle">Q</text>
</svg>

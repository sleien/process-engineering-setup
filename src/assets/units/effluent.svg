<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Effluent outfall: pipe + chevrons + open mouth discharging into rippled water.
     Same stroke style / canvas scale as the other unit SVGs. -->
<svg
   width="20mm"
   height="17.5mm"
   viewBox="0 0 75 67"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
   <!-- Outfall pipe -->
   <rect x="3" y="20" width="42" height="14" rx="2"
         fill="none" stroke="#000000" stroke-width="1.6"/>
   <!-- Flow chevrons -->
   <path d="M 10 22 L 15 27 L 10 32" fill="none" stroke="#000000" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M 17 22 L 22 27 L 17 32" fill="none" stroke="#000000" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M 24 22 L 29 27 L 24 32" fill="none" stroke="#000000" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round"/>
   <!-- Open discharge mouth -->
   <line x1="45" y1="20" x2="45" y2="34" stroke="#000000" stroke-width="1.6"/>
   <line x1="48" y1="20" x2="48" y2="34" stroke="#000000" stroke-width="1.6"/>
   <!-- Discharge stream (curved) -->
   <path d="M 48 27 C 52 29 54 34 55 42" fill="none" stroke="#000000"
         stroke-width="1.6" stroke-linecap="round"/>
   <!-- Water surface (ripples) -->
   <path d="M 40 48 q 4 -4 8 0 t 8 0 t 8 0" fill="none" stroke="#000000"
         stroke-width="1.4" stroke-linecap="round"/>
   <path d="M 44 56 q 4 -4 8 0 t 8 0" fill="none" stroke="#000000"
         stroke-width="1.4" stroke-linecap="round"/>
</svg>
